    source: "https://developers.openai.com/api/docs/pricing (verified 2026-09-17; standard tier, <272K context). Cache write from the Flagship table where shown; older models have no cache-write price, so cache_write = input. gpt-5-codex from its model page."
    models:
      gpt-6-astra:   {input: 10.0, output: 50.0, cache_read: 1.0,   cache_write: 12.5, effective: "2026-09-17"}
      gpt-5.6-sol:   {input: 4.0,  output: 20.0, cache_read: 0.4,   cache_write: 5.0,  effective: "2026-09-17", note: "promotional price through at least 2026-11-21"}
