# List prices in USD per 1M tokens. The kit computes cost from these for every agent,
# regardless of how the agent is billed (subscription or API). Keep entries dated and sourced.
version: "2026-09-17"
currency: USD
unit: per_1M_tokens
providers:
  anthropic:
    source: "Anthropic first-party API rates as cached in the Claude Code claude-api skill (2026-06-24). Cache write = 1.25x input, cache read = 0.10x input unless noted."
    models:
      claude-fable-5-1: {input: 10.0, output: 50.0, cache_read: 0.25, cache_write: 12.5, effective: "2026-06-24"}
      claude-fable-5:   {input: 10.0, output: 50.0, cache_read: 1.0,  cache_write: 12.5, effective: "2026-06-24"}
      claude-opus-5:    {input: 5.0,  output: 25.0, cache_read: 0.5,  cache_write: 6.25, effective: "2026-06-24"}
