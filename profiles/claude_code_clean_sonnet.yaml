name: claude_code_clean_sonnet
adapter: claude_code
model: claude-sonnet-5
params:
  clean_slate: true          # --strict-mcp-config --setting-sources "" (keeps keychain login)
  permission_mode: acceptEdits
  allowed_tools: "Read,Edit,Write,Glob,Grep,Bash"
  max_turns: 40
  max_budget_usd: 2.0
  effort: high
