      gpt-5.5:       {input: 5.0,  output: 30.0, cache_read: 0.5,   cache_write: 5.0,  effective: "2026-09-17"}
      gpt-5.4:       {input: 2.5,  output: 15.0, cache_read: 0.25,  cache_write: 2.5,  effective: "2026-09-17"}
      gpt-5.4-mini:  {input: 0.75, output: 4.5,  cache_read: 0.075, cache_write: 0.75, effective: "2026-09-17"}
